services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5688:5678"          # host:container -> chỉ đổi số bên trái
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
      - "NODES_EXCLUDE=[]"
      - WEBHOOK_URL=http://localhost:5688/
      - N8N_EDITOR_BASE_URL=http://localhost:5688/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=qa_user
      - POSTGRES_PASSWORD=Doi_Mat_Khau_Cua_Ban
      - POSTGRES_DB=qa_db
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  n8n_data:
  pg_data: